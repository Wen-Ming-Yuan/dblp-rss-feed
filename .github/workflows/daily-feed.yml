name: Generate DBLP RSS

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 确保有写权限来部署
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # 安装代码依赖（来自 requirements.txt）
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Install Playwright and system libs
        run: |
          # 安装浏览器依赖（如果需要 Playwright）
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2
          python -m pip install playwright
          playwright install chromium --with-deps

      - name: Run script
        run: python fetch_rss.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
