name: Generate DBLP RSS

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 确保有写权限来部署
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # 安装代码依赖（来自 requirements.txt）
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Install Playwright and browsers
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run script (write output to ./public)
        run: |
          mkdir -p public
          python fetch_rss.py
          # 如果脚本直接在仓库根生成文件，手动移动到 public
          mv path/to/generated.rss public/ || true

      - name: Deploy to GitHub Pages (only publish ./public)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          commit_message: "Deploy generated pages [skip ci]"
